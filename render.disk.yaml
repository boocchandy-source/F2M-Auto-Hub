# F2M Auto-Hub — durable single-instance Blueprint (paid)
#
# Use this file instead of render.yaml when you want the app to keep using
# SQLite on a persistent Render disk (no external database to manage).
#
# How to use:
#   1. Rename this file to render.yaml (replace the free Blueprint), or set the
#      Blueprint file path to render.disk.yaml during setup.
#   2. Apply the Blueprint and enter a strong ADMIN_PASSWORD when prompted.
#
# Cost note: this Blueprint uses a paid web service plan (0.5 CPU / 512 MB,
# $7/month at the time of writing) plus a 1 GB persistent disk ($0.25/GB/month).
# Persistent disks are not available on Render's free instance type.
#
# Docs: https://render.com/docs/disks

services:
  - type: web
    name: f2m-autohub
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: f2m-autohub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SEED_DATA
        value: "1"
      # Keep the production database free of sample customers/requests.
      # Set to "1" if you want demo workflow records for a showcase deploy.
      - key: SEED_DEMO_DATA
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
