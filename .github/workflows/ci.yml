name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and production smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile source
        run: python -m compileall -q f2m wsgi.py run.py

      - name: Run test suite
        run: python -m pytest -q

      - name: Smoke-test the production entry point
        env:
          SECRET_KEY: ci-only-secret-key
          ADMIN_PASSWORD: ci-only-admin-password
          SEED_DATA: "0"
          DATA_DIR: ${{ runner.temp }}/f2m-data
        run: |
          python -c "from wsgi import app; c = app.test_client(); assert c.get('/healthz').status_code == 200; assert c.get('/login').status_code == 200; print('production entry point OK')"
